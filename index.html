<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Redirecionando autenticação...</title>
</head>
<body>
    <p>Concluindo login, aguarde...</p>
    <script>
        // Captura os parâmetros ?code=...&state=... enviados pelo Google
        const searchParams = window.location.search;
        
        if (searchParams) {
            // Redireciona para a rota callback do seu backend mantendo os parâmetros
            window.location.href = "http://163.176.100.181:8080/auth/google/callback" + searchParams;
        } else {
            document.body.innerText = "Nenhum código de autorização encontrado.";
        }
    </script>
</body>
</html>
